# Install once per server: /etc/nginx/snippets/storefront.conf
# Included inside each store's server block. Change it here and every store follows.

# Browsers ignore this header over plain http, so it is safe before the certificate exists.
add_header Strict-Transport-Security "max-age=31536000" always;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/css text/plain text/xml text/javascript application/javascript
           application/json application/xml application/rss+xml
           application/manifest+json image/svg+xml;

# Hashed build files: never change under the same name, so cached for a year.
location /_next/static/ {
    alias /var/www/product-preview/frontend/.next/static/;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000" always;  # add_header is not inherited into a location that has its own
}

location / {
    proxy_pass http://storefront_next;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $storefront_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    # Stores are public over https only; also right before the certificate is issued,
    # so canonical and sitemap URLs never come out as http.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_cache_bypass $http_upgrade;
}
