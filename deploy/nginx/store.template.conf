# A new store, before its certificate. STORE_DOMAIN is replaced when the file is copied:
#
#   D=example.com
#   sudo sed "s/STORE_DOMAIN/$D/g" store.template.conf > /etc/nginx/sites-available/$D
#   sudo ln -s /etc/nginx/sites-available/$D /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then the certificate (adds the 443 block and the http -> https redirect):
#
#   sudo certbot --nginx --redirect -d $D
#   sudo sed -i 's/listen 443 ssl;/listen 443 ssl http2;/' /etc/nginx/sites-available/$D
#   sudo nginx -t && sudo systemctl reload nginx
#
# Needs storefront-upstream.conf and storefront.conf installed once on the server.

server {
    listen 80;
    server_name STORE_DOMAIN;

    include snippets/storefront.conf;
}
