# Install once per server: /etc/nginx/conf.d/storefront-upstream.conf
# Shared by every store domain. Defines names only; a site uses them only
# if it includes snippets/storefront.conf.

map $http_upgrade $storefront_connection {
    default upgrade;
    ''      '';          # Regular requests: keep the connection to Next alive
}

upstream storefront_next {
    server 127.0.0.1:3002;   # The storefront (Next.js) port
    keepalive 32;
}
